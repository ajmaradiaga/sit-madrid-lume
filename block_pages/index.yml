blocks:
  - type: hero
    id: main-logo
    title: SAP Inside Track Madrid
    intro: "8 y 9 de abril 2027\n\n\U0001F4CD NEORIS AI Hub, powered by EPAM · Madrid"
    text: "## [Más info y registro \U0001F3AB](https://community.sap.com/t5/madrid-events/gh-p/madrid)"
  - type: imagetext
    id: what-is-sit
    theme: is-dark width-full box-fill
    src: /files/photos/madrid-metropolis-atardecer.jpg
    text: >-
      *Un SAP Inside Track (SIT) es un evento comunitario local donde los
      miembros de la Comunidad SAP se reúnen para compartir conocimientos sobre
      temas relacionados con SAP. El evento es impulsado/organizado por la
      comunidad, todos los interesados pueden participar. Todos pueden
      beneficiarse o contribuir: actuar como presentador, participar en
      discusiones, intercambiar información, hacer networking o disfrutar de las
      reuniones sociales por la noche.*
  - type: location
    title: ¿Cómo llegar?
    id: location
    theme: is-light width-box box-fill
    embed: >-
      <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3034.103962272104!2d-3.6676984222642637!3d40.495084071427016!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd4229559aabda55%3A0x418763045875e97c!2sNEORIS!5e0!3m2!1sen!2ses!4v1769510476743!5m2!1sen!2ses"
      width="600" height="450" style="border:0;" allowfullscreen=""
