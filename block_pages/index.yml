  - type: text
    title: "\U0001F5E3️ Propón una charla para el SIT Madrid /  Do you want to speak at the SIT Madrid?"
    id: speakers-wanted
    theme: is-dark width-full box-fill
    columns: false
    text: >-
      ¡Gracias por interesarte en participar como ponente en el SIT Madrid!
