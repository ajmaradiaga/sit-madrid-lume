  - type: imagetext
    id: what-is-sit
    theme: is-primary width-full box-fill
    src: /files/photos/madrid-metropolis-arriba.jpg
    text: >-
      *Un SAP Inside Track (SIT) es un evento comunitario local donde los
      miembros de la Comunidad SAP se reúnen para compartir conocimientos sobre
      temas relacionados con SAP. El evento es impulsado/organizado por la
      comunidad, todos los interesados pueden participar. Todos pueden
      beneficiarse o contribuir: actuar como presentador, participar en
      discusiones, intercambiar información, hacer networking o disfrutar de las
      reuniones sociales por la noche.*
