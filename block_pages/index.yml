  - type: faq
    title: Frequently Asked Questions
    id: faq
    theme: is-light width-box box-fill
    questions:
      - question: When and where will SIT Madrid take place?
        answer: >-
          SAP Inside Track will be held on April 9, 2027 at the EPAM Neoris AI Hub.
          The full address is [here](#location).
      - question: Can I attend only the CodeJam or both events?
        answer: >-
          The SAP CodeJam and the SAP Inside Track are separate events and you can attend just one event if you wish so.
      - question: 'I am interested in sponsoring the event, who should I get in touch with?'
        answer: >-
          First of all, thanks for your interest in sponsoring the event. Please find more details [here](https://sitmadrid.com).
      - question: Where can I register (RSVP) for the events?
        answer: >-
          This website is purely informational. The registration links will be
          published here once they are open. In the meantime, follow the SAP
          Community Madrid events group:

          - SAP Inside Track Madrid:
          [Link](https://community.sap.com/t5/madrid-events/gh-p/madrid)

          - SAP CodeJam:
          [Link](https://community.sap.com/t5/sap-codejam/eb-p/codejam-events)
